name: Bug report
description: Report a reproducible Carribrary problem without sharing private library data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For setup questions, use Discussions. For security problems, see SECURITY.md. Never include passwords, tokens, private links, borrower information, backups or complete logs."
  - type: input
    id: version
    attributes:
      label: Carribrary version
      placeholder: 2.0.53-preview
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, operating system and installer/browser
      placeholder: Windows 11 EXE, Kubuntu Flatpak, Raspberry Pi ARM64 DEB, or iPhone Safari PWA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Explain the steps using fictional names and books where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happens?
      description: Include only a short, redacted error message or screenshot if useful.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked my report and attachments for passwords, tokens, private links and personal borrower information.
          required: true
